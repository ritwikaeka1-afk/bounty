name: Build and deploy Node.js app to Azure Web App - bounty

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          node -e 'for (const name of ["NEXT_PUBLIC_SUPABASE_URL", "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"]) { if (!process.env[name]?.trim()) { console.error("Missing required build variable: " + name); process.exit(1); } }'
          npm run build

      - name: Run tests if present
        run: npm run test --if-present

      - name: Create standalone deployment package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/.next
          # Only use Next.js traced dependencies; never copy root node_modules.
          cp -a .next/standalone/. deploy/
          cp -a .next/static deploy/.next/static
          if [ -d public ]; then cp -a public deploy/public; fi
          find deploy -name '.git' -prune -exec rm -rf {} +
          find deploy -name '.env*' -prune -exec rm -rf {} +
          node -e 'require("fs").writeFileSync("deploy/package.json", JSON.stringify({name:"bounty",private:true,scripts:{start:"node server.js"}}, null, 2) + "\n")'
          test -f deploy/server.js
          test -d deploy/.next/static
          node --check deploy/server.js
          # Preserve symlinks, permissions, and hidden .next files in transit.
          tar -czf standalone.tar.gz -C deploy .

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: standalone.tar.gz
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Extract standalone deployment package
        run: |
          mkdir deploy
          tar -xzf standalone.tar.gz -C deploy

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: bounty
          slot-name: Production
          package: deploy
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_203552E780D74041A819C32CC4877F19 }}
